# Ensure submodules: false for checkout step
name: Android Build CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          clean: true

      - name: Fix Git Directory Permissions
        run: |
          git config --global --add safe.directory '*'

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build Android APK
        run: |
          yes | buildozer --color=never -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
