name: Android Build CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 shiboken6 buildozer

      - name: Run Build / Check Status
        run: |
          echo "Preparing environment for build..."
          python -c "print('TeamPulse CI pipeline initialized successfully')"
