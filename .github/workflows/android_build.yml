name: Build TeamPulse Android APK & Packages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          pip install PySide6 shiboken6 firebase-admin buildozer cython briefcase

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: |
          mkdir -p bin deployment dist
          
          # Initialize Buildozer spec if not present
          if [ ! -f "buildozer.spec" ]; then
            buildozer init
            sed -i 's/title = My Application/title = TeamPulse/' buildozer.spec
            sed -i 's/package.name = myapp/package.name = teampulse/' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = org.teampulse/' buildozer.spec
            sed -i 's/requirements = python3,kivy/requirements = python3,pyside6,firebase_admin/' buildozer.spec
            sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION/' buildozer.spec
          fi

          # Execute Buildozer Android compilation
          buildozer -v android debug || true

      - name: Find and Upload APK & Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeamPulse-Android-APK
          path: |
            bin/*.apk
            **/*.apk
            build/**/*.apk
            deployment/**/*.apk
            dist/*
          if-no-files-found: warn
