name: Build TeamPulse Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 nuitka shiboken6

      - name: Run Build / Packaging
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 --include-data-files=main.qml=main.qml --include-data-files=EmployeeView.qml=EmployeeView.qml --include-data-files=ManagerView.qml=ManagerView.qml --include-data-files=logo.png=logo.png --output-dir=deployment main.py || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamPulse-Android-APK
          path: |
            deployment/**/*.apk
            dist/**/*.apk
            build/**/*.apk
